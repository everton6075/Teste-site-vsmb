<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header id="user-info" class="hidden">
            <img id="user-avatar" src="" alt="Avatar">
            <span id="user-name"></span>
            <button id="logout-btn">Sair</button>
        </header>

        <main>
            <div id="login-container">
                <button id="discord-login">Entrar com Discord</button>
            </div>

            <div id="daily-container" class="hidden">
                <button id="daily-btn">Resgatar Daily</button>
                <div id="daily-result"></div>
            </div>
        </main>
    </div>

    <script type="importmap">
    {
        "imports": {
            "axios": "https://cdn.jsdelivr.net/npm/axios@1.3.4/dist/axios.min.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
